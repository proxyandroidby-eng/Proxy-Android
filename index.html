<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROXY ANDROID · PROXY ANDROID</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #0b0b0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        /* ---- TELA DE LOGIN ---- */
        .login-container {
            width: 100%;
            max-width: 400px;
            background: #14141c;
            border-radius: 32px;
            padding: 40px 28px 36px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.8);
            border: 1px solid #2a2a3a;
            text-align: center;
            transition: 0.25s ease;
        }

        .login-container h1 {
            color: #e0e0ff;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 12px #6a4aff;
        }

        .login-container .sub {
            color: #a855f7;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 3px;
            margin-top: 4px;
            border-bottom: 1px solid #2e2e42;
            padding-bottom: 24px;
        }

        .login-container .key-input {
            margin: 32px 0 20px;
        }

        .login-container .key-input input {
            width: 100%;
            padding: 16px 18px;
            background: #1a1a28;
            border: 2px solid #2a2a42;
            border-radius: 40px;
            color: #e0e0ff;
            font-size: 18px;
            text-align: center;
            letter-spacing: 4px;
            outline: none;
            transition: 0.2s;
        }

        .login-container .key-input input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 20px #7c3aed44;
        }

        .login-container .key-input input::placeholder {
            color: #4a4a6a;
            letter-spacing: 2px;
            font-size: 14px;
        }

        .login-btn {
            width: 100%;
            padding: 14px 0;
            background: #7c3aed;
            border: none;
            border-radius: 40px;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 2px;
        }

        .login-btn:hover {
            background: #6d28d9;
            box-shadow: 0 0 28px #7c3aed88;
            transform: scale(1.02);
        }

        .login-btn:active {
            transform: scale(0.96);
        }

        .error-msg {
            color: #f87171;
            font-size: 13px;
            margin-top: 14px;
            min-height: 20px;
            font-weight: 500;
        }

        .footnote-login {
            margin-top: 28px;
            color: #4a4a6a;
            font-size: 11px;
            border-top: 1px solid #1e1e30;
            padding-top: 18px;
        }

        /* ---- ANIMAÇÃO SHAKE ---- */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-12px); }
            75% { transform: translateX(12px); }
        }
        .shake {
            animation: shake 0.3s;
        }

        /* ============================================================ */
        /* PAINEL PRINCIPAL - estilo da imagem (FUNCOES)                */
        /* ============================================================ */
        .main-app {
            display: none;
            width: 100%;
            max-width: 420px;
        }

        .main-app.active {
            display: block;
        }

        .panel-container {
            background: #14141c;
            border-radius: 32px;
            padding: 28px 22px 32px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.8);
            border: 1px solid #2a2a3a;
        }

        /* cabeçalho */
        .panel-header {
            text-align: center;
            border-bottom: 1px solid #2e2e42;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .panel-header h1 {
            color: #e0e0ff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 12px #6a4aff;
        }

        .panel-header .owner {
            color: #a855f7;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* título FUNCOES */
        .functions-title {
            color: #c4c4e0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 16px;
            border-left: 4px solid #7c3aed;
            padding-left: 12px;
        }

        /* cada item de função */
        .function-item {
            background: #10101a;
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 10px;
            border: 1px solid #28283a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.15s;
        }

        .function-item .func-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .function-item .func-name {
            color: #e0e0ff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .function-item .func-desc {
            color: #7a7a9a;
            font-size: 13px;
            font-weight: 400;
        }

        /* switch estilo "caixa" (como na imagem) */
        .switch-box {
            width: 44px;
            height: 26px;
            background: #000000;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
            position: relative;
            border: 2px solid #2a2a3a;
        }

        .switch-box.active {
            background: #7c3aed;
            border-color: #7c3aed;
            box-shadow: 0 0 16px #7c3aed55;
        }

        .switch-box::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            background: #4a4a6a;
            border-radius: 4px;
            transition: 0.2s;
        }

        .switch-box.active::after {
            left: 21px;
            background: #ffffff;
        }

        /* botão INJETAR */
        .inject-btn {
            width: 100%;
            padding: 14px 0;
            background: #7c3aed;
            border: none;
            border-radius: 40px;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 3px;
            margin-top: 18px;
        }

        .inject-btn:hover {
            background: #6d28d9;
            box-shadow: 0 0 28px #7c3aed88;
            transform: scale(1.02);
        }

        .inject-btn:active {
            transform: scale(0.96);
        }

        .footer-panel {
            margin-top: 18px;
            color: #4a4a6a;
            font-size: 11px;
            text-align: center;
            border-top: 1px solid #1e1e30;
            padding-top: 16px;
        }

        @media (max-width: 460px) {
            .login-container, .panel-container {
                padding: 20px 14px;
            }
            .function-item {
                flex-wrap: wrap;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <!-- ========================================================= -->
    <!-- TELA DE LOGIN                                             -->
    <!-- ========================================================= -->
    <div id="loginPage" class="login-container">
        <h1>PROXY ANDROID</h1>
        <div class="sub">AUTENTICAÇÃO</div>

        <div class="key-input">
            <input type="password" id="keyField" placeholder="INSIRA SUA CHAVE" maxlength="20" autofocus>
        </div>

        <button class="login-btn" id="loginBtn">ACESSAR PAINEL</button>
        <div class="error-msg" id="errorMsg"></div>

        <div class="footnote-login">
            NÃO TEM UMA CHAVE? CLIQUE AQUI
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- PAINEL PRINCIPAL (estilo FUNCOES da imagem)               -->
    <!-- ========================================================= -->
    <div id="mainApp" class="main-app">
        <div class="panel-container">

            <!-- cabeçalho: PROXY ANDROID + DONO -->
            <div class="panel-header">
                <h1>PROXY ANDROID</h1>
                <div class="owner">DONO: DUARTE MODDER</div>
            </div>

            <!-- título FUNCOES -->
            <div class="functions-title">⚡ FUNCOES</div>

            <!-- HS ALTO -->
            <div class="function-item">
                <div class="func-info">
                    <span class="func-name">HS ALTO</span>
                    <span class="func-desc">HS Acima da Cabeça</span>
                </div>
                <div class="switch-box" onclick="toggleBox(this)"></div>
            </div>

            <!-- HS PEITO -->
            <div class="function-item">
                <div class="func-info">
                    <span class="func-name">HS PEITO</span>
                    <span class="func-desc">HS FULL</span>
                </div>
                <div class="switch-box" onclick="toggleBox(this)"></div>
            </div>

            <!-- HS NECK -->
            <div class="function-item">
                <div class="func-info">
                    <span class="func-name">HS NECK</span>
                    <span class="func-desc">HS Pescoço Legit</span>
                </div>
                <div class="switch-box" onclick="toggleBox(this)"></div>
            </div>

            <!-- BYPASS -->
            <div class="function-item">
                <div class="func-info">
                    <span class="func-name">BYPASS</span>
                    <span class="func-desc">ant detect</span>
                </div>
                <div class="switch-box" onclick="toggleBox(this)"></div>
            </div>

            <!-- BOTÃO INJETAR -->
            <button class="inject-btn" id="injectBtn">INJETAR</button>

            <div class="footer-panel">PROXY ANDROID · BY DUARTE MODDER</div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. TOGGLE dos switches (estilo caixa)
        // ============================================================
        function toggleBox(el) {
            el.classList.toggle('active');
            // Atualiza cores conforme estado
            if (el.classList.contains('active')) {
                el.style.background = '#7c3aed';
                el.style.borderColor = '#7c3aed';
            } else {
                el.style.background = '#000000';
                el.style.borderColor = '#2a2a3a';
            }
        }

        // ============================================================
        // 2. INICIALIZAÇÃO: TODOS OS SWITCHES DESATIVADOS (preto)
        // ============================================================
        document.querySelectorAll('.switch-box').forEach(el => {
            // Remove qualquer classe 'active' que possa existir
            el.classList.remove('active');
            // Aplica estilo desativado (preto)
            el.style.background = '#000000';
            el.style.borderColor = '#2a2a3a';
        });

        // ============================================================
        // 3. LOGIN (chave = "DUARTE")
        // ============================================================
        const loginBtn = document.getElementById('loginBtn');
        const keyField = document.getElementById('keyField');
        const errorMsg = document.getElementById('errorMsg');
        const loginPage = document.getElementById('loginPage');
        const mainApp = document.getElementById('mainApp');

        const VALID_KEY = "DUARTE";

        function attemptLogin() {
            const inputKey = keyField.value.trim();
            if (inputKey === VALID_KEY) {
                loginPage.style.display = 'none';
                mainApp.classList.add('active');
                errorMsg.textContent = '';
            } else {
                errorMsg.textContent = '❌ CHAVE INVÁLIDA! TENTE NOVAMENTE.';
                keyField.value = '';
                keyField.focus();
                loginPage.classList.remove('shake');
                void loginPage.offsetWidth;
                loginPage.classList.add('shake');
                setTimeout(() => loginPage.classList.remove('shake'), 400);
            }
        }

        loginBtn.addEventListener('click', attemptLogin);
        keyField.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                attemptLogin();
            }
        });

        // ============================================================
        // 4. BOTÃO INJETAR
        // ============================================================
        document.getElementById('injectBtn').addEventListener('click', function() {
            // Coleta o estado de cada switch
            const items = document.querySelectorAll('.function-item');
            let status = '';
            items.forEach(item => {
                const name = item.querySelector('.func-name').innerText;
                const isActive = item.querySelector('.switch-box').classList.contains('active');
                status += `${name}: ${isActive ? '✅ ATIVO' : '❌ INATIVO'}\n`;
            });

            const msg = `🔧 INJEÇÃO EXECUTADA!\n\n${status}\n✅ Todas as funções foram aplicadas.`;
            alert(msg);

            // Feedback visual no botão
            this.style.transform = 'scale(0.96)';
            setTimeout(() => { this.style.transform = ''; }, 150);
        });

        console.log('PROXY ANDROID · PROXY ANDROID carregado (chave: DUARTE)');
    </script>

</body>
</html>
